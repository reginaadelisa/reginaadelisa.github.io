media:
  - label: "Foto Profil"
    input: "assets/images/profile"
    output: "assets/images/profile"
    extensions: ["jpg", "jpeg", "png", "webp"]
    public_path: "assets/images/profile"
  - label: "Gambar Proyek"
    input: "assets/images/projects"
    output: "assets/images/projects"
    extensions: ["jpg", "jpeg", "png", "webp"]
    public_path: "assets/images/projects"
  - label: "Gambar Pengalaman Kerja"
    input: "assets/images/work"
    output: "assets/images/work"
    extensions: ["jpg", "jpeg", "png", "webp"]
    public_path: "assets/images/work"
  - label: "Gambar Organisasi"
    input: "assets/images/organizations"
    output: "assets/images/organizations"
    extensions: ["jpg", "jpeg", "png", "webp"]
    public_path: "assets/images/organizations"
  - label: "Gambar Prestasi"
    input: "assets/images/achievements"
    output: "assets/images/achievements"
    extensions: ["jpg", "jpeg", "png", "webp"]
    public_path: "assets/images/achievements"
  - label: "Gambar Publikasi / Riset"
    input: "assets/images/publications"
    output: "assets/images/publications"
    extensions: ["jpg", "jpeg", "png", "webp"]
    public_path: "assets/images/publications"
  - label: "Foto Sertifikat"
    input: "assets/certificates"
    output: "assets/certificates"
    extensions: ["jpg", "jpeg", "png", "webp", "pdf"]
    public_path: "assets/certificates"
  - label: "Dokumen (CV, PDF)"
    input: "assets/documents"
    output: "assets/documents"
    extensions: ["pdf", "doc", "docx"]
    public_path: "assets/documents"
  - label: "Gambar Umum"
    input: "assets/images"
    output: "assets/images"
    extensions: ["jpg", "jpeg", "png", "webp", "gif", "svg"]
    public_path: "assets/images"

content:
  - name: "profil"
    label: "Profil & Beranda"
    path: "content/profile/profile.json"
    type: "file"
    format: "json"
    fields:
      - name: "name"
        label: "Nama Lengkap"
        type: "string"
      - name: "headline"
        label: "Headline / Jabatan Profesi"
        type: "string"
      - name: "education"
        label: "Pendidikan"
        type: "string"
      - name: "intro"
        label: "Kalimat Perkenalan (misal: Halo! Saya...)"
        type: "string"
      - name: "bio"
        label: "Deskripsi Profil"
        type: "text"
      - name: "tagline"
        label: "Tagline Singkat"
        type: "string"
      - name: "photo"
        label: "Foto Profil"
        type: "image"
      - name: "cv"
        label: "File CV (PDF)"
        type: "file"
      - name: "interests"
        label: "Minat & Bidang Profesional"
        type: "string"
        list: true
      - name: "button_primary_label"
        label: "Label Tombol Utama (misal: Unduh CV)"
        type: "string"
      - name: "button_primary_link"
        label: "Link Tombol Utama (misal: path ke CV atau URL)"
        type: "string"
      - name: "button_secondary_label"
        label: "Label Tombol Kedua (misal: Hubungi Saya)"
        type: "string"
      - name: "button_secondary_link"
        label: "Link Tombol Kedua (misal: #kontak)"
        type: "string"

  - name: "kontak"
    label: "Kontak"
    path: "content/contact/contact.json"
    type: "file"
    format: "json"
    fields:
      - name: "email"
        label: "Email"
        type: "string"
      - name: "linkedin"
        label: "URL LinkedIn"
        type: "string"
      - name: "github"
        label: "URL GitHub"
        type: "string"
      - name: "other_links"
        label: "Tautan Lain"
        type: "object"
        list: true
        fields:
          - name: "label"
            label: "Label Tautan"
            type: "string"
          - name: "url"
            label: "URL"
            type: "string"

  - name: "keahlian"
    label: "Keahlian"
    path: "content/skills/skills.json"
    type: "file"
    format: "json"
    fields:
      - name: "hard_skills"
        label: "Hard Skills (kategori tools & kompetensi)"
        type: "object"
        list: true
        fields:
          - name: "category"
            label: "Nama Kategori"
            type: "string"
          - name: "items"
            label: "Daftar Item"
            type: "object"
            list: true
            fields:
              - name: "name"
                label: "Nama Tools / Kemampuan"
                type: "string"
              - name: "logo"
                label: "Logo (gambar, opsional)"
                type: "image"
              - name: "description"
                label: "Deskripsi Singkat"
                type: "string"
      - name: "soft_skills"
        label: "Soft Skills"
        type: "object"
        list: true
        fields:
          - name: "name"
            label: "Nama Soft Skill"
            type: "string"
          - name: "description"
            label: "Deskripsi"
            type: "string"

  - name: "pengalaman-kerja"
    label: "Pengalaman Kerja"
    path: "content/work-experiences/work-experiences.json"
    type: "file"
    format: "json"
    fields:
      - name: "experiences"
        label: "Daftar Pengalaman Kerja"
        type: "object"
        list: true
        fields:
          - name: "position"
            label: "Posisi / Jabatan"
            type: "string"
          - name: "institution"
            label: "Institusi / Perusahaan"
            type: "string"
          - name: "department"
            label: "Departemen / Program Studi"
            type: "string"
          - name: "period_start"
            label: "Periode Mulai"
            type: "string"
          - name: "period_end"
            label: "Periode Selesai"
            type: "string"
          - name: "description"
            label: "Deskripsi Pekerjaan"
            type: "text"
          - name: "responsibilities"
            label: "Tanggung Jawab"
            type: "string"
            list: true
          - name: "contributions"
            label: "Kontribusi"
            type: "text"
          - name: "photos"
            label: "Galeri Foto Dokumentasi"
            type: "image"
            list: true

  - name: "pengalaman-organisasi"
    label: "Pengalaman Organisasi"
    path: "content/organizations/organizations.json"
    type: "file"
    format: "json"
    fields:
      - name: "organizations"
        label: "Daftar Pengalaman Organisasi"
        type: "object"
        list: true
        fields:
          - name: "organization"
            label: "Nama Organisasi / Kegiatan"
            type: "string"
          - name: "position"
            label: "Jabatan / Posisi"
            type: "string"
          - name: "period_start"
            label: "Periode Mulai"
            type: "string"
          - name: "period_end"
            label: "Periode Selesai"
            type: "string"
          - name: "description"
            label: "Deskripsi Kegiatan"
            type: "text"
          - name: "responsibilities"
            label: "Tanggung Jawab"
            type: "string"
            list: true
          - name: "contributions"
            label: "Kontribusi"
            type: "text"
          - name: "photos"
            label: "Galeri Foto Dokumentasi"
            type: "image"
            list: true

  - name: "projects"
    label: "Projects"
    path: "content/projects/projects.json"
    type: "file"
    format: "json"
    fields:
      - name: "projects"
        label: "Daftar Proyek"
        type: "object"
        list: true
        fields:
          - name: "title"
            label: "Judul Proyek"
            type: "string"
          - name: "category"
            label: "Kategori"
            type: "string"
          - name: "description"
            label: "Deskripsi Singkat"
            type: "text"
          - name: "background"
            label: "Latar Belakang & Tujuan"
            type: "text"
          - name: "methodology"
            label: "Metodologi / Proses Pengerjaan"
            type: "text"
          - name: "results"
            label: "Hasil Proyek"
            type: "text"
          - name: "tools"
            label: "Tools yang Digunakan"
