            list: true
          - name: "role"
            label: "Peran dalam Proyek"
            type: "string"
          - name: "thumbnail"
            label: "Thumbnail Proyek"
            type: "image"
          - name: "photos"
            label: "Galeri Screenshot / Foto Proyek"
